name: Publish website
on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/**', '.github/workflows/website.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: website
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the website folder
        run: |
          mkdir -p public/img
          cp site/* public/
          cp assets/a14-pomodoro-icon.png public/img/icon.png
          cp assets/social-preview.png public/img/social-preview.png
          for f in hero modes workflow history themes; do cp assets/readme/$f.png public/img/; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
